name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Validate import script syntax
        run: python3 -m py_compile scripts/import-global-terrain.py
      - name: Validate browser worker syntax
        run: |
          node --check public/js/pipeline.worker.js
          node --check public/js/arcgis.js
